name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-acceptance:
    name: Integration acceptance (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install export tools
        run: brew install pandoc poppler
      - name: Install ATS simulator
        run: |
          python3 -m venv "$RUNNER_TEMP/atsim-venv"
          "$RUNNER_TEMP/atsim-venv/bin/pip" install ./vendor/atsim
          echo "NAV_CENTER_ATSIM_BIN=$RUNNER_TEMP/atsim-venv/bin/atsim" >> "$GITHUB_ENV"
      - name: Run integration acceptance
        run: scripts/integration-acceptance.sh "$RUNNER_TEMP/integration-acceptance"
      - name: Upload integration acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-acceptance
          path: ${{ runner.temp }}/integration-acceptance
          if-no-files-found: error

  repository:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install checksum-pinned repository tools
        run: |
          python3 scripts/bootstrap-tools.py --tool gitleaks --tool actionlint --tool zizmor --directory "$RUNNER_TEMP/nav-center-tools"
          echo "$RUNNER_TEMP/nav-center-tools" >> "$GITHUB_PATH"
      - name: Current source and history secret scans
        run: |
          gitleaks dir . --redact
          gitleaks git . --log-opts="--all" --redact
      - name: Workflow and snapshot checks
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.event.after }}
        run: |
          case "$EVENT_NAME" in
            pull_request)
              merge_base="$(git merge-base "$PR_BASE_SHA" HEAD)"
              git log --format= --check --diff-merges=remerge "$merge_base..HEAD"
              ;;
            push)
              tip="${PUSH_AFTER_SHA:-HEAD}"
              git cat-file -e "$tip^{commit}"
              if [[ -n "${PUSH_BEFORE_SHA:-}" && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]] && git cat-file -e "$PUSH_BEFORE_SHA^{commit}" 2>/dev/null; then
                git log --format= --check --diff-merges=remerge "$PUSH_BEFORE_SHA..$tip"
              else
                # No reachable before-SHA (first push, or a force-push over an
                # unfetched commit): check the tip alone rather than walking all
                # of history through --check.
                git log -1 --format= --check --diff-merges=remerge "$tip"
              fi
              ;;
            workflow_dispatch)
              git log -1 --format= --check --diff-merges=remerge HEAD
              ;;
            *)
              echo "Unsupported event for committed-range check: $EVENT_NAME" >&2
              exit 1
              ;;
          esac
          actionlint
          zizmor --offline --persona auditor .github/workflows
          python3 -B scripts/verify-vendor.py
      - name: Snapshot unit tests in synthetic workspace
        env:
          ATSIM_JOB_HUNT_ROOT: ${{ github.workspace }}
          PYTHONPATH: vendor/atsim
        run: python3 -B -m unittest discover -s vendor/atsim/atsim/tests -v

  swift:
    name: Build, test and release contracts
    needs: repository
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Record native toolchain
        run: |
          mkdir -p reports/native
          printf 'NAV_CENTER_WORKSPACE_ROOT=%s/nav-center-synthetic\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          {
            sw_vers
            uname -m
            xcodebuild -version
            swift --version
            xcrun llvm-cov --version
            xcrun swift-format --version
          } | tee reports/native/toolchain.txt
          xcodebuild -checkFirstLaunchStatus
      - name: Install checksum-pinned SwiftLint
        run: |
          python3 scripts/bootstrap-tools.py --tool swiftlint --directory "$RUNNER_TEMP/nav-center-tools"
          echo "$RUNNER_TEMP/nav-center-tools" >> "$GITHUB_PATH"
      - name: Formatting baseline (advisory)
        id: format
        continue-on-error: true # Adoption baseline; never rewrites inherited source.
        run: xcrun swift-format lint --strict --configuration .swift-format --recursive Sources Tests Package.swift > reports/native/swift-format.txt 2>&1
      - name: Focused SwiftLint checks
        id: swiftlint
        continue-on-error: true # Report inherited findings during baseline calibration.
        run: swiftlint lint --strict --no-cache --config .swiftlint.yml --reporter json > reports/native/swiftlint.json
      - name: Source and release script checks
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.event.after }}
        run: |
          case "$EVENT_NAME" in
            pull_request)
              merge_base="$(git merge-base "$PR_BASE_SHA" HEAD)"
              git log --format= --check --diff-merges=remerge "$merge_base..HEAD"
              ;;
            push)
              tip="${PUSH_AFTER_SHA:-HEAD}"
              git cat-file -e "$tip^{commit}"
              if [[ -n "${PUSH_BEFORE_SHA:-}" && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]] && git cat-file -e "$PUSH_BEFORE_SHA^{commit}" 2>/dev/null; then
                git log --format= --check --diff-merges=remerge "$PUSH_BEFORE_SHA..$tip"
              else
                # No reachable before-SHA (first push, or a force-push over an
                # unfetched commit): check the tip alone rather than walking all
                # of history through --check.
                git log -1 --format= --check --diff-merges=remerge "$tip"
              fi
              ;;
            workflow_dispatch)
              git log -1 --format= --check --diff-merges=remerge HEAD
              ;;
            *)
              echo "Unsupported event for committed-range check: $EVENT_NAME" >&2
              exit 1
              ;;
          esac
          for script in scripts/*.sh; do bash -n "$script"; done
          python3 -B -m unittest discover -s scripts/tests -v
      - name: Test with coverage
        run: |
          swift build --scratch-path "$RUNNER_TEMP/nav-center-swift" --enable-code-coverage
          swift test --scratch-path "$RUNNER_TEMP/nav-center-swift" --enable-code-coverage 2>&1 | tee reports/native/swift-test.txt
      - name: Export and validate native analysis reports
        run: |
          bash scripts/export-coverage.sh "$RUNNER_TEMP/nav-center-swift" reports/native
          python3 -B scripts/check-analysis-reports.py reports/native
      - name: Debug and release builds
        run: |
          swift build --scratch-path "$RUNNER_TEMP/nav-center-swift"
          swift build --scratch-path "$RUNNER_TEMP/nav-center-swift" -c release
      - name: CLI behavior
        run: NAVCENTERCTL="$(swift build --scratch-path "$RUNNER_TEMP/nav-center-swift" --show-bin-path)/navcenterctl" python3 -B scripts/tests/test_cli.py -v
      - name: Address sanitizer
        run: |
          swift build --scratch-path "$RUNNER_TEMP/nav-center-asan" --sanitize=address
          swift test --scratch-path "$RUNNER_TEMP/nav-center-asan" --sanitize=address 2>&1 | tee reports/native/asan.txt
      - name: Thread sanitizer
        run: |
          swift build --scratch-path "$RUNNER_TEMP/nav-center-tsan" --sanitize=thread
          swift test --scratch-path "$RUNNER_TEMP/nav-center-tsan" --sanitize=thread 2>&1 | tee reports/native/tsan.txt
      - name: Record integration and formatting scope
        if: always()
        env:
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
          SWIFTLINT_OUTCOME: ${{ steps.swiftlint.outcome }}
        run: |
          {
            printf 'Formatting baseline outcome: %s\n\n' "$FORMAT_OUTCOME"
            printf 'SwiftLint baseline outcome: %s\n\n' "$SWIFTLINT_OUTCOME"
            echo 'Real Chrome and external ATS checks are opt-in and skipped unless explicitly configured.'
            echo 'The test logs retain actual XCTest skips. Authenticated Codex, UI/VoiceOver, signing, and minimum-OS checks require separate evidence.'
            echo 'Sonar is optional main-only reporting after successful CI; PRs, forks, and Dependabot do not receive Sonar credentials or analysis.'
          } | tee reports/native/integration-scope.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload native quality evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-quality
          path: reports/native/
          if-no-files-found: warn
          retention-days: 14
