name: Beta Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, for example 0.1.0-beta.1
        required: true
      build:
        description: Positive integer build number
        required: true

permissions:
  contents: read

jobs:
  beta-dmg:
    name: Validate signed beta artifact
    runs-on: macos-14
    environment: release
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require clean current-tree and history secret scans
        run: |
          set -euo pipefail
          command -v gitleaks >/dev/null || { echo "Release runner requires preinstalled Gitleaks." >&2; exit 1; }
          gitleaks dir . --redact --report-format json --report-path "$RUNNER_TEMP/nav-center-current-secrets.json"
          gitleaks git . --log-opts="--all" --redact --report-format json --report-path "$RUNNER_TEMP/nav-center-history-secrets.json"
      - name: Test release inputs and scripts
        run: |
          git diff --check
          for script in scripts/*.sh; do bash -n "$script"; done
          python3 -B -m unittest discover -s scripts/tests -v
          swift test --enable-code-coverage
          swift build
          swift build -c release
          NAVCENTERCTL="$(swift build -c release --show-bin-path)/navcenterctl" python3 -B scripts/tests/test_cli.py -v
          swift test --scratch-path "$RUNNER_TEMP/nav-center-release-asan" --sanitize=address
          swift test --scratch-path "$RUNNER_TEMP/nav-center-release-tsan" --sanitize=thread
      - name: Provision temporary signing keychain
        env:
          DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          : "${DEVELOPER_ID_CERTIFICATE_BASE64:?Developer ID PKCS12 certificate secret is required}"
          : "${DEVELOPER_ID_CERTIFICATE_PASSWORD:?Certificate password secret is required}"
          KEYCHAIN="$RUNNER_TEMP/nav-center-signing.keychain-db"
          CERTIFICATE="$RUNNER_TEMP/nav-center-signing.p12"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          trap 'rm -f "$CERTIFICATE"' EXIT
          umask 077
          printf '%s' "$DEVELOPER_ID_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERTIFICATE" -k "$KEYCHAIN" -P "$DEVELOPER_ID_CERTIFICATE_PASSWORD" -T /usr/bin/codesign >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          printf 'NAV_CENTER_SIGNING_KEYCHAIN=%s\n' "$KEYCHAIN" >> "$GITHUB_ENV"
      - name: Build, sign, notarize and verify beta DMG
        env:
          NAV_CENTER_VERSION: ${{ inputs.version }}
          NAV_CENTER_BUILD: ${{ inputs.build }}
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          scripts/package-beta-dmg.sh --distribution
          {
            git rev-parse HEAD
            printf 'Version: %s\nBuild: %s\n' "$NAV_CENTER_VERSION" "$NAV_CENTER_BUILD"
            sw_vers
            swift --version
            xcodebuild -version
          } > dist/BUILD.txt
      - name: Verify the packaged app from a read-only mount
        run: |
          set -euo pipefail
          images=(dist/*.dmg)
          [[ ${#images[@]} -eq 1 && -f "${images[0]}" ]]
          MOUNTPOINT="$RUNNER_TEMP/nav-center-artifact-mount"
          mkdir "$MOUNTPOINT"
          trap 'hdiutil detach "$MOUNTPOINT"' EXIT
          hdiutil attach -readonly -nobrowse -mountpoint "$MOUNTPOINT" "${images[0]}"
          codesign --verify --deep --strict "$MOUNTPOINT/Nav Center.app"
          spctl -a -vv -t execute "$MOUNTPOINT/Nav Center.app"
          xcrun stapler validate "${images[0]}"
          (cd dist && shasum -a 256 -c ./*.dmg.sha256)
      - name: Upload validated beta artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nav-center-beta-${{ inputs.version }}-${{ inputs.build }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
            dist/*.dmg.notary.json
            dist/BUILD.txt
            ${{ runner.temp }}/nav-center-current-secrets.json
            ${{ runner.temp }}/nav-center-history-secrets.json
      - name: Remove temporary signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/nav-center-signing.p12"
          if [[ -f "$RUNNER_TEMP/nav-center-signing.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/nav-center-signing.keychain-db"
          fi
