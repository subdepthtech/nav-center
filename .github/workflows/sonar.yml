name: SonarQube Cloud (reporting)

on:
  # The job rejects forks/PRs/failures, pins the trusted main SHA and run ID,
  # checks report hashes, and never executes an artifact or checked-out script.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read # Download evidence from the exact successful CI run.

defaults:
  run:
    shell: bash

concurrency:
  group: sonar-main
  cancel-in-progress: false

jobs:
  sonar:
    name: Sonar main baseline (optional)
    environment: sonar
    if: >-
      vars.SONAR_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Checkout the successful main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download evidence from that exact CI run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-quality
          path: reports/native
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Check report revision and paths
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          report = Path('reports/native')
          summary = json.loads((report / 'analysis-summary.json').read_text())
          assert summary['revision'] == os.environ['EXPECTED_SHA'], 'Report revision mismatch'
          assert summary['coverage_files'] > 0 and summary['executable_lines'] > 0, 'Empty coverage'
          for name in ('swift-coverage.txt', 'swiftlint.json'):
              assert hashlib.sha256((report / name).read_bytes()).hexdigest() == summary['report_sha256'][name], 'Report digest mismatch'
          root = Path.cwd().resolve()
          for relative in summary['coverage_files_list']:
              path = Path(relative)
              assert not path.is_absolute() and relative.startswith('Sources/') and relative.endswith('.swift')
              assert (root / path).resolve().is_relative_to(root / 'Sources') and (root / path).is_file()
          headers = set(re.findall(r'^(.+\.swift):$', (report / 'swift-coverage.txt').read_text(), re.MULTILINE))
          assert headers == set(summary['coverage_files_list']), 'Coverage inventory mismatch'
          findings = json.loads((report / 'swiftlint.json').read_text())
          assert isinstance(findings, list) and len(findings) == summary['swiftlint_findings']
          for finding in findings:
              path = Path(finding['file'])
              assert not path.is_absolute() and path.as_posix().startswith('Sources/') and path.suffix == '.swift'
              assert (root / path).resolve().is_relative_to(root / 'Sources') and (root / path).is_file()
          print(json.dumps(summary, indent=2))
          PY
      - name: Analyze maintained Swift source
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          scannerVersion: 8.1.0.6389
          args: >-
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.scm.revision=${{ github.event.workflow_run.head_sha }}
            -Dsonar.branch.name=main
      - name: Baseline status
        if: always()
        run: echo 'Sonar is nonrequired while coverage and findings are calibrated. Scanner success does not establish quality-gate or release acceptance.' >> "$GITHUB_STEP_SUMMARY"
