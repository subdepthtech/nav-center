name: Bug report
description: Report a reproducible defect using synthetic data.
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities or exposed secrets, use the private reporting link instead. Do not include real resumes, application history, credentials, or unredacted logs."
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce with synthetic data
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Version, macOS version, and architecture
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence and checks performed
