# Actual organization/project keys are supplied by repository Actions variables.
# Only maintained Swift source and tests may be uploaded for this analysis.
sonar.sources=Sources
sonar.tests=Tests
sonar.inclusions=**/*.swift
sonar.test.inclusions=**/*.swift
sonar.exclusions=vendor/**,.build/**,dist/**,reports/**,.tools/**,workspace/**,applications/**,master-resumes/**,tracking/**,imports/**,feedback/**
sonar.sourceEncoding=UTF-8
sonar.swift.coverage.reportPaths=reports/native/swift-coverage.txt
sonar.swift.swiftLint.reportPaths=reports/native/swiftlint.json
# Baseline calibration: no gate waiting or local claim of server acceptance.
sonar.qualitygate.wait=false
